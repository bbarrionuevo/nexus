# Configuración general. paper_trading debe seguir en true hasta autorización humana (R-02).
paper_trading: true
capital_eur: 100.0

# Comisiones de referencia (en %) para la calculadora de rentabilidad (core/fees.py).
# Son estimaciones: el agente verifica las de MEXC con la API al arrancar.
fees:
  binance: {maker_pct: 0.10, taker_pct: 0.10}
  kraken:  {maker_pct: 0.25, taker_pct: 0.40}
  mexc:    {maker_pct: 0.00, taker_pct: 0.05}
  sepa_transfer_eur: 0.0
  withdrawal_fixed_eur: {USDT_TRC20: 1.0, USDC_ERC20: 3.0, USDC_SOL: 0.5}
  p2p_spread_pct_default: 0.50

# Topes de movimientos FIAT (R-20): se usan como máximo el 60% de cada umbral regulatorio.
# Aplican cuando se deposite/retire dinero entre bancos y exchanges (core/compliance.py).
limits:
  safety_margin: 0.60
  eu:
    cumulative_eur_cap: 10000.0
    max_tx_per_day: 10
    max_tx_per_hour: 3
  ar:
    monthly_ars_cap: 50000000.0
    per_tx_ars_cap: 2500000.0
