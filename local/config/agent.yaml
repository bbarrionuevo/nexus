# Agente de market making. live: false = paper trading. En esta versión NO existe código para
# enviar órdenes reales: activar el modo real exige construirlo y tu autorización (R-02).
live: false
exchange: mexc
symbols: [BONKUSDT, AIUSDT]   # candidatos con señal en paper; se revisan con el informe diario
maker_fee_pct: 0.0             # MEXC spot API; al arrancar se verifica con la API si hay claves
taker_fee_pct: 0.05
stop_pct: 1.0                  # stop a mercado al caer 1% bajo la entrada
min_edge_pct: 0.0              # margen mínimo sobre entrada+comisiones para vender como maker
max_hold_min: 30               # tenencia máxima; luego sale al bid (taker)
poll_seconds: 1.0
max_vol_1m_pct: 0.3            # no comprar si la volatilidad del precio supera 0,3%/min (25-oct: 6-7% de
                               # stops por debajo; 24% y -21 € por encima de 0,5%/min)
strategy_tag: "v3-vol0.3"      # versión de la estrategia: la evidencia de R-15 se mide por versión
stale_data_s: 20               # sin datos frescos por 20 s => se cancela la compra pendiente

# Laboratorio: mide en paper (sin riesgo ni capital) pares de MEXC elegidos solos cada pocas horas.
lab:
  enabled: true
  max_symbols: 12
  min_quote_volume_usdt: 200000
  min_spread_pct: 0.10
  max_spread_pct: 1.50
  reselect_hours: 6
  per_loop: 12                 # pares de laboratorio sondeados por ciclo (en paralelo; ~13 pedidos/s)
  pause_window: 15             # si las últimas 15 vueltas de un par pierden en promedio...
  pause_hours: 24              # ...se pausa 24 h y no se vuelve a elegir
  fast_pause_stops: 3          # o antes: 3 stops dentro de las últimas 6 vueltas
  fast_pause_window: 6
  # Variantes que corren junto a la vigente sobre los mismos datos (además del control sin filtro).
  # v4: además del filtro de volatilidad, compra solo si en el mejor nivel hay al menos 60% del tamaño
  # del lado comprador (bidQty / (bidQty + askQty) ≥ 0,6): busca menos compras justo antes de una baja.
  # Regla fijada de antemano; se compara fuera de muestra contra la vigente y el control.
  # v5: como la vigente, pero compra 1 tick ARRIBA del mejor bid y vende 1 tick ABAJO del mejor ask
  # (si el spread deja lugar): queda primera en la cola en vez de esperar detrás de toda la cola
  # visible. Más llenados a cambio de 2 ticks de margen y quizá más compras justo antes de una baja.
  variants:
    v4-imb0.6: {max_vol_1m_pct: 0.3, min_imbalance: 0.6}
    v5-tick1: {max_vol_1m_pct: 0.3, improve_ticks: 1}
  # Asignador (explorar/explotar, ver nexus/allocator.py). Reglas fijadas de antemano: NO se ajustan
  # mirando resultados. Se conservan hasta keep_max pares con cota inferior > 0 (media − desvío/√n)
  # sobre sus últimas score_window vueltas de los últimos score_days días (mínimo score_min_n).
  rank: edge                   # explorar primero: spread % × llenados posibles por hora (cola vs. volumen)
  allocator: true
  keep_max: 6
  score_window: 60
  score_min_n: 20
  score_days: 7
  eval_max: 3                  # también se conservan hasta 3 pares EN EVALUACIÓN: media > 0 con al menos
  eval_min_n: 5                # 5 vueltas, para que lleguen al mínimo de la cota sin que se los suelte

# Cobertura MEXC→Binance con dinero real (agent/hedge_live.py; se activa con authorize --cobertura).
# Cotiza en MEXC solo si, al precio de Binance, la vuelta cubierta deja al menos min_edge_pct después
# de la comisión tomadora de Binance (0,1%; 0,075% pagando con BNB).
hedge:
  min_edge_pct: 0.1
  taker_fee_pct: 0.1

# Límites para 100 EUR de capital (derivación en docs/LIMITES.md). Bajar = libre; subir = solo
# con tu autorización (el CI rechaza valores por encima de la línea base aprobada).
risk:
  max_position_eur: 40         # por posición
  max_total_exposure_eur: 80   # suma de posiciones abiertas (deja 20 EUR de colchón)
  daily_loss_limit_eur: 2      # 2% del capital: no abre más ese día
  weekly_loss_limit_eur: 4     # 4%
  max_drawdown_eur: 8          # 8% acumulado: halt permanente, rearme humano
  max_consecutive_stops: 3
  stops_cooldown_min: 60
  max_orders_per_minute: 30
  losing_days_window: 7        # PnL neto de los últimos 7 días < 0 => la estrategia se apaga
