name: Paper trading en vivo (market making con cola)
on:
  schedule: [{cron: "11 */4 * * *"}]
  workflow_dispatch:
    inputs:
      symbols: {default: "BONKUSDT,IDUSDT,AIUSDT,BTCFDUSD,ETHFDUSD"}
      minutes: {default: "40"}
      mexc_symbols: {default: "AIUSDT,BONKUSDT,IDUSDT,BTCUSDT,ETHUSDT"}
permissions: {contents: write}
concurrency: live-paper
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {ref: data, path: datawt}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -r local/requirements.txt
      - run: cd local && python -m nexus.live_paper_maker ../datawt/data/live_paper_maker.jsonl "${{ inputs.symbols || 'BONKUSDT,IDUSDT,AIUSDT,BTCFDUSD,ETHFDUSD' }}" ${{ inputs.minutes || 40 }}
      - name: MEXC (maker 0%) en paralelo
        if: always()
        run: cd local && python -m nexus.live_paper_mexc ../datawt/data/live_paper_mexc.jsonl "${{ inputs.mexc_symbols || 'AIUSDT,BONKUSDT,IDUSDT,BTCUSDT,ETHUSDT' }}" ${{ inputs.minutes || 40 }}
      - run: |
          cd datawt
          git config user.name nexus-bot; git config user.email bot@users.noreply.github.com
          git add data/; git commit -m "live paper $(date -u +%FT%TZ)" || exit 0
          git pull -q --rebase origin data && git push origin HEAD:data
