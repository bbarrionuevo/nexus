name: Viabilidad real (carry de funding + transferencias)
on:
  schedule: [{cron: "41 */6 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: research-feasibility
jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {ref: data, path: datawt}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -r local/requirements.txt
      - run: cd local && python -m nexus.research_feasibility ../datawt/data
      - run: cd local && python -m nexus.paper_carry ../datawt/data/paper_carry.json ../datawt/data/feasibility.json | tee -a ../datawt/data/feasibility.md
      - run: cat datawt/data/feasibility.md >> $GITHUB_STEP_SUMMARY
      - name: Guardar datos
        run: |
          cd datawt
          git config user.name nexus-bot; git config user.email bot@users.noreply.github.com
          git add data/; git commit -m "viabilidad $(date -u +%FT%TZ)" || exit 0
          git pull -q --rebase origin data && git push origin HEAD:data
