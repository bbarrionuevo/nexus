name: CI (tests + control de seguridad)
on:
  push:
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -r local/requirements.txt
      - name: Control de seguridad (límites aprobados, modo real apagado)
        run: python backtest/run.py
      - name: Tests (incluye tests de las reglas)
        run: cd local && python -m pytest -q
  protected-paths:
    # Rojo = el PR toca algo de categoría C: solo lo puede aprobar y fusionar una persona.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {fetch-depth: 0}
      - run: pip install PyYAML==6.0.3
      - run: python backtest/protected_paths.py origin/${{ github.base_ref }} HEAD
