name: Investigación market making cubierto (MEXC + Binance)
on:
  schedule: [{cron: "29 */6 * * *"}]
  workflow_dispatch:
    inputs:
      symbols: {default: "IOSTUSDT,QUICKUSDT,DCRUSDT,TREEUSDT,PORTOUSDT,CYBERUSDT,ANIMEUSDT,LUNAUSDT,IDUSDT,AMPUSDT,POLYXUSDT,OPENUSDT,IMXUSDT"}
      minutes: {default: "330"}
permissions: {contents: write}
concurrency: research-hedge
jobs:
  hedge:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {ref: data, path: datawt}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -r local/requirements.txt
      # Casi continuo: 5,5 h cada 6 h. 1 lote de 25 € por lado (100 € por par) y rebalanceo manual cada 12 h.
      - run: cd local && python -m nexus.live_paper_hedge ../datawt/data/live_paper_hedge.jsonl "${{ inputs.symbols || 'IOSTUSDT,QUICKUSDT,DCRUSDT,TREEUSDT,PORTOUSDT,CYBERUSDT,ANIMEUSDT,LUNAUSDT,IDUSDT,AMPUSDT,POLYXUSDT,OPENUSDT,IMXUSDT' }}" ${{ inputs.minutes || 330 }} 0.1 1 25 > /dev/null
      - run: cat datawt/data/live_paper_hedge.md >> $GITHUB_STEP_SUMMARY
      - run: |
          cd datawt
          git config user.name nexus-bot; git config user.email bot@users.noreply.github.com
          git add data/; git commit -m "hedge $(date -u +%FT%TZ)" || exit 0
          git pull -q --rebase origin data && git push origin HEAD:data
