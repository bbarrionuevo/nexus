name: Descubrimiento de oportunidades
on:
  schedule: [{cron: "*/20 * * * *"}]
  workflow_dispatch:
    inputs:
      samples: {default: "10"}
      interval: {default: "30"}
permissions: {contents: write}
concurrency: data-branch
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: data, path: datawt}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r local/requirements.txt
      - run: cd local && python -m nexus.discover ../datawt/data/discovery.jsonl ${{ inputs.samples || 10 }} ${{ inputs.interval || 30 }}
      - run: cd local && python -m nexus.daily_report ../datawt/data/discovery.jsonl > ../datawt/data/report.md && cat ../datawt/data/report.md >> $GITHUB_STEP_SUMMARY
      - name: Guardar datos
        run: |
          cd datawt
          git config user.name nexus-bot; git config user.email bot@users.noreply.github.com
          git add data/
          git commit -m "descubrimiento $(date -u +%FT%TZ)" || exit 0
          git pull -q --rebase origin data && git push origin HEAD:data
