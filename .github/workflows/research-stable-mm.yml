name: Market making en pares estables y de moneda local (escaneo + paper)
on:
  schedule: [{cron: "53 */6 * * *"}]
  workflow_dispatch:
    inputs:
      minutes: {default: "330"}
permissions: {contents: write}
concurrency: research-stable-mm
jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {ref: data, path: datawt}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -r local/requirements.txt
      - run: cd local && python -m nexus.discovery.stable_mm ../datawt/data/stable_mm.json | tee ../datawt/data/stable_mm.md
      - run: cat datawt/data/stable_mm.md >> $GITHUB_STEP_SUMMARY
      - name: Elegir pares de Binance para el paper
        id: pick
        run: |
          syms=$(python3 -c "
          import json
          d = json.load(open('datawt/data/stable_mm.json'))['pairs']
          b = [x for x in d if x['exchange'] == 'Binance' and x['trades_per_min'] >= 0.5 and x['spread_pct'] > 0]
          b.sort(key=lambda x: -x['spread_pct'] * min(x['trades_per_min'], 30))   # spread x actividad
          print(','.join(x['symbol'] for x in b[:8]))")
          echo "symbols=$syms" >> $GITHUB_OUTPUT; echo "pares: $syms"
      - name: Paper con modelo de cola (Binance WebSocket)
        if: steps.pick.outputs.symbols != ''
        run: cd local && python -m nexus.live_paper_maker ../datawt/data/live_paper_stable.jsonl "${{ steps.pick.outputs.symbols }}" ${{ inputs.minutes || 330 }} > /dev/null && tail -1 ../datawt/data/live_paper_stable.jsonl
      - name: Guardar datos
        if: always()
        run: |
          cd datawt
          git config user.name nexus-bot; git config user.email bot@users.noreply.github.com
          git add data/; git commit -m "stable mm $(date -u +%FT%TZ)" || exit 0
          git pull -q --rebase origin data && git push origin HEAD:data
