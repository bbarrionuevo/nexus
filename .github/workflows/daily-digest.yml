name: Informe diario (mail)
on:
  schedule: [{cron: "41 10 * * *"}]
  workflow_dispatch:
permissions: {contents: read, issues: write}
concurrency: digest
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -r local/requirements.txt
      - name: Datos del PC y de la investigación
        run: |
          git fetch -q origin pc-status && git show FETCH_HEAD:pc_status.json > /tmp/pc.json || echo "sin latido"
          git fetch -q origin data && git show FETCH_HEAD:data/discovery.jsonl > /tmp/discovery.jsonl || true
          if [ -s /tmp/discovery.jsonl ]; then cd local && python -m nexus.daily_report /tmp/discovery.jsonl > /tmp/research.md; fi
      - name: Publicar informe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXUS_OWNER: ${{ github.repository_owner }}
        run: cd local && python -m nexus.monitor digest /tmp/pc.json /tmp/research.md
